name: ETS All Products Audit

on:
  push:
    paths:
      - '.github/workflows/ets-all-products-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch entire official ETS Shopify catalog
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request, time
          base='https://www.extremeturbosystems.com'
          headers={'User-Agent':'Mozilla/5.0 (compatible; Red5GarageETSAudit/1.0)','Accept':'application/json,text/plain,*/*'}
          all_products=[]
          for page in range(1,5):
              url=f'{base}/products.json?limit=250&page={page}'
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as resp:
                  data=json.loads(resp.read().decode('utf-8'))
              products=data.get('products',[])
              print('page',page,'count',len(products),url)
              all_products.extend(products)
              if len(products)<250:
                  break
              time.sleep(1)
          os.makedirs('ets_all',exist_ok=True)
          with open('ets_all/all_products.json','w',encoding='utf-8') as f:
              json.dump({'products':all_products},f,indent=2,ensure_ascii=False)
          print('total',len(all_products))
          print('ets vendor',sum(1 for p in all_products if p.get('vendor')=='Extreme Turbo Systems'))
          PY
      - name: Upload full ETS catalog
        uses: actions/upload-artifact@v4
        with:
          name: ets-all-products-json
          path: ets_all/all_products.json
          if-no-files-found: error
