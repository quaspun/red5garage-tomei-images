name: ETS Catalog Fetch

on:
  push:
    paths:
      - '.github/workflows/ets-catalog-fetch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch official ETS Shopify product data and product HTML
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, re
          base='https://www.extremeturbosystems.com'
          collections=['subaru','mitsubishi','toyota','nissan']
          os.makedirs('ets_catalog/html',exist_ok=True)
          combined={}
          headers={'User-Agent':'Mozilla/5.0 (compatible; Red5GarageCatalogFetch/1.0)','Accept':'text/html,application/json,text/plain,*/*'}
          seen={}
          for collection in collections:
              url=f'{base}/collections/{collection}/products.json?limit=250'
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as resp:
                  data=json.loads(resp.read().decode('utf-8'))
              products=data.get('products',[])
              combined[collection]=products
              with open(f'ets_catalog/{collection}.json','w',encoding='utf-8') as f: json.dump(data,f,indent=2,ensure_ascii=False)
              for p in products:
                  if p.get('vendor')!='Extreme Turbo Systems':
                      continue
                  seen[p['handle']]=p
              print(collection,len(products),url)
              time.sleep(.5)
          with open('ets_catalog/combined.json','w',encoding='utf-8') as f: json.dump(combined,f,indent=2,ensure_ascii=False)

          report=[]
          for i,(handle,p) in enumerate(seen.items(),1):
              url=f'{base}/products/{handle}'
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=60) as resp:
                      text=resp.read().decode('utf-8','replace')
                  with open(f'ets_catalog/html/{handle}.html','w',encoding='utf-8') as f: f.write(text)
                  prop_names=sorted(set(re.findall(r'name=["\']properties\[([^\]]+)\]["\']',text,re.I)))
                  interesting=[]
                  for kw in ['Intake Manifold Compatibility','Throttle Body Compatibility','Intercooler Size','Infinite Options','product-options','properties[']:
                      if kw.lower() in text.lower(): interesting.append(kw)
                  report.append({'handle':handle,'title':p.get('title'),'url':url,'property_names':prop_names,'interesting_markers':interesting,'html_bytes':len(text)})
              except Exception as e:
                  report.append({'handle':handle,'title':p.get('title'),'url':url,'error':str(e)})
              if i%20==0: print('html',i,'of',len(seen))
              time.sleep(.25)
          with open('ets_catalog/html_report.json','w',encoding='utf-8') as f: json.dump(report,f,indent=2,ensure_ascii=False)
          print('unique ETS product pages',len(seen))
          PY
      - name: Upload ETS product JSON and HTML audit
        uses: actions/upload-artifact@v4
        with:
          name: ets-product-json-html
          path: ets_catalog/
          if-no-files-found: error
